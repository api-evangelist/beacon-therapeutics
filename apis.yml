aid: beacon-therapeutics
name: Beacon Therapeutics
description: 'Beacon Therapeutics is a clinical-stage ophthalmic gene therapy company
  founded in 2023 to save and restore the sight of people living with rare and prevalent
  retinal diseases that lead to blindness. Built around adeno-associated virus (AAV)
  gene therapy, the company delivers functional copies of mutated genes into retinal
  cells so the body can produce the missing therapeutic protein. Its lead clinical
  program, laru-zova (laruparetigene zovaparvovec), targets X-linked retinitis pigmentosa
  (XLRP), alongside preclinical programs in dry age-related macular degeneration (dAMD)
  and cone-rod dystrophy (CRD), the latter in-licensed from the University of Oxford.
  Beacon operates across the United Kingdom and the United States, with a corporate
  base in London and a US presence in the Cambridge, Massachusetts area. It is a therapeutics
  developer, not a software or data platform company, and publishes no public API,
  SDK or developer program.'
